[package]
name = "wallet"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
balius-sdk = { path = "../../../balius-sdk" }
serde = { version = "1.0.204", features = ["derive"] }
serde_with = "3.9.0"
pallas-codec = "=1.5.0-rc.3"
hex = "0.4.3"

[lib]
crate-type = ["cdylib"]

[dev-dependencies]
serde_json = "1.0.128"
pallas-primitives = "=1.5.0-rc.3"
pallas-traverse = "=1.5.0-rc.3"

[package.metadata.release]
release = false
